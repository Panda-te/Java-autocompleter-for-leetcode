<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LC Java Autocomplete</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 240px;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      padding: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #f89c26, #ef4743);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: white;
    }

    .title { font-weight: 600; font-size: 14px; color: #fff; }
    .subtitle { font-size: 11px; color: #858585; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2d2d2d;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    .toggle-label { color: #ccc; font-size: 13px; }

    .toggle {
      position: relative;
      width: 38px;
      height: 20px;
    }

    .toggle input { display: none; }

    .toggle-track {
      width: 38px;
      height: 20px;
      background: #555;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      position: relative;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle input:checked + .toggle-track {
      background: #f89c26;
    }

    .toggle input:checked + .toggle-track::after {
      transform: translateX(18px);
    }

    .status {
      font-size: 11px;
      color: #858585;
      text-align: center;
      margin-top: 4px;
    }

    .status.on { color: #4ec9b0; }

    .divider {
      border: none;
      border-top: 1px solid #333;
      margin: 10px 0;
    }

    .legend { font-size: 11px; color: #858585; margin-bottom: 6px; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #2d2d2d;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
    }

    .chip-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      font-size: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #1e1e1e;
    }

    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">J</div>
    <div>
      <div class="title">Java Autocomplete</div>
      <div class="subtitle">for LeetCode</div>
    </div>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Enable autocomplete</span>
    <label class="toggle">
      <input type="checkbox" id="toggle" checked>
      <div class="toggle-track"></div>
    </label>
  </div>

  <div class="status on" id="status">● Active on LeetCode</div>

  <hr class="divider">

  <div class="legend">Completion types</div>
  <div class="chips">
    <div class="chip"><div class="chip-dot" style="background:#c586c0">S</div> Snippets</div>
    <div class="chip"><div class="chip-dot" style="background:#9cdcfe">V</div> Variables</div>
    <div class="chip"><div class="chip-dot" style="background:#569cd6">K</div> Keywords</div>
    <div class="chip"><div class="chip-dot" style="background:#4ec9b0">T</div> Types</div>
    <div class="chip"><div class="chip-dot" style="background:#dcdcaa">M</div> Methods</div>
  </div>

  <div class="hint">Tab / Enter to accept · Esc to dismiss</div>

  <script src="popup.js"></script>
</body>
</html>
